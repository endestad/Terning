name: Deploy til GitHub Pages

on:
  push:
    branches: ["main", "claude/disc-golf-dice-app-WUOdm"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Tillat én samtidig deploy; nyeste push vinner.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Forsøk å skru på Pages automatisk (krever at Pages-API er tilgjengelig).
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
